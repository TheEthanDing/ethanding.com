<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive look at the integrations an autonomous data agent needs across a modern data stack.">
  <title>One Agent, Your Whole Stack · Ethan Ding</title>
  <link rel="icon" href="/images/profile.png">
  <style>
    :root { --bg:#08090b; --text:#e8eaed; --dim:#9aa1aa; --faint:#5e646d; --line:#20242b; --red:#ff4136; --amber:#e0a52e; --mono:ui-monospace,"SFMono-Regular",Consolas,monospace; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body { margin:0; color:var(--text); background:radial-gradient(130% 90% at 18% 12%,#0e1014 0%,var(--bg) 65%); font-family:var(--sans); }
    button,a { color:inherit; font:inherit; }
    :focus-visible { outline:2px solid #fff; outline-offset:3px; }
    .wires { position:fixed; inset:0; z-index:1; width:100vw; height:100vh; pointer-events:none; }
    .wires path { fill:none; }
    .panel { position:fixed; inset:0 auto 0 0; z-index:4; display:flex; flex-direction:column; gap:14px; width:320px; height:100vh; padding:24px; background:linear-gradient(90deg,var(--bg) 72%,rgba(8,9,11,0)); }
    .back { align-self:flex-start; margin-bottom:18px; color:var(--dim); font:11px var(--mono); text-decoration:none; }
    .back:hover { color:#fff; }
    .eyebrow { color:var(--faint); font:10px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    .agent { align-self:flex-start; }
    .core { padding:13px 15px; color:var(--bg); background:#fff; border-radius:14px; text-align:center; box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 46px rgba(255,255,255,.12); }
    .core strong { display:block; font-size:15px; }
    .core small { display:block; margin-top:2px; color:#3a3f48; font:8px var(--mono); letter-spacing:.14em; text-transform:uppercase; }
    .counter { display:flex; align-items:baseline; gap:10px; margin-top:6px; }
    .num { font:600 58px/.9 var(--mono); letter-spacing:-.03em; font-variant-numeric:tabular-nums; transition:color .5s; }
    .num.hot { color:var(--red); }
    .unit { max-width:155px; color:var(--dim); font-size:12px; line-height:1.3; }
    .unit b { color:#fff; }
    .narr { min-height:40px; font-size:13px; line-height:1.4; transition:opacity .25s; }
    .cap { min-height:62px; padding-top:12px; color:var(--faint); border-top:1px solid #1c1f25; font-size:12px; line-height:1.4; }
    .cap.lit { color:var(--text); }
    .pre { display:block; margin-bottom:4px; color:var(--faint); font:8px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; }
    .btn { padding:8px 13px; color:var(--text); background:#13161b; border:1px solid #2a2e35; border-radius:8px; font-size:12px; cursor:pointer; }
    .btn:hover { border-color:#4d535d; }
    .btn.primary { color:#fff; background:rgba(255,65,54,.12); border-color:var(--red); }
    .btn.pulse { animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 7px rgba(255,65,54,0); } }
    .layer { position:fixed; top:8vh; left:307px; z-index:3; width:26px; height:84vh; opacity:0; transform:scaleX(.3); transform-origin:left; transition:opacity .5s,transform .5s; }
    .layer.show { opacity:1; transform:scaleX(1); }
    .layer-bar { width:100%; height:100%; background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.55); border-radius:13px; }
    .layer-label { position:absolute; top:-6px; left:34px; color:#fff; font:10px var(--mono); letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; }
    .wall { position:relative; z-index:2; margin-left:320px; padding:40px 40px 60vh 60px; }
    .band { margin-bottom:30px; }
    .band-label { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; padding-bottom:7px; color:var(--dim); border-bottom:1px solid #1c1f25; font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    .band-label small { color:var(--faint); font:12px var(--sans); letter-spacing:.02em; text-transform:none; }
    .band.legacy .band-label { color:var(--amber); border-color:rgba(224,165,46,.3); }
    .platform { margin-bottom:14px; }
    .platform-head { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
    .dot { width:9px; height:9px; border-radius:50%; }
    .platform-name { font-size:13px; font-weight:600; }
    .count { color:var(--faint); font:9px var(--mono); }
    .badge { padding:2px 6px; color:var(--amber); border:1px solid rgba(224,165,46,.4); border-radius:5px; font:8px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { padding:5px 9px; color:var(--dim); background:#101319; border:1px solid var(--line); border-left:2px solid var(--c); border-radius:6px; font-size:10px; white-space:nowrap; cursor:pointer; opacity:0; transform:translateX(-4px); transition:opacity .35s,transform .35s,color .14s,background .14s,border-color .14s; }
    .chip.on { opacity:1; transform:none; }
    .chip:hover,.chip.active,.chip:focus { color:#fff; background:#181c23; border-color:var(--c); }
    .chip.legacy { border:1px dashed rgba(224,165,46,.55); border-left:2px dashed var(--amber); }
    .chip.legacy::before { margin-right:5px; color:var(--amber); content:"▣"; }
    @media (max-width:760px) {
      .panel { position:relative; width:auto; height:auto; min-height:480px; background:var(--bg); }
      .controls { margin-top:20px; }
      .wall { margin-left:0; padding:20px 20px 40vh; }
      .layer { display:none; }
      .wires { opacity:.25; }
      .chip { white-space:normal; text-align:left; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <svg class="wires" id="wires" aria-hidden="true"></svg>
  <aside class="panel">
    <a class="back" href="/">← Ethan Ding</a>
    <div class="eyebrow">So you want an autonomous data agent</div>
    <div class="agent" id="agent"><div class="core"><strong>YOUR AGENT</strong><small>one mandate</small></div></div>
    <div class="counter"><span class="num" id="num">0</span><span class="unit" id="unit">capabilities it must be granted</span></div>
    <div class="narr" id="narr">You want one agent that can run your whole data estate…</div>
    <div class="cap" id="cap"><span class="pre">on hover or focus</span>Choose any capability to see what it lets your agent <b>do</b>.</div>
    <div class="controls"><button class="btn" id="replay">↻ Replay</button><button class="btn primary" id="fixbtn">⊕ The fix</button></div>
  </aside>
  <div class="layer" id="layer"><div class="layer-bar"></div><div class="layer-label">Context + access layer</div></div>
  <main class="wall" id="wall"></main>
  <script src="/data-agent-stack.js"></script>
</body>
</html>
