<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title07 desc07">
  <title id="title07">one deployment: lose money once, keep the installed asset</title>
  <desc id="desc07">an illustrative chart shows ten million dollars of annual customer payments against high first-year delivery cost that falls sharply in later years.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#202124}.muted{fill:#5f6368}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:15px;font-weight:700}.head{font-size:26px;font-weight:700}.axis{stroke:#5f6368;stroke-width:1.4}.grid{stroke:#dadce0;stroke-width:1}.revenue{fill:#e6f4ef;stroke:#0f9d75;stroke-width:2}.cost{fill:#fff0eb;stroke:#d64545;stroke-width:2}.green{fill:#0f9d75}.red{fill:#d64545}.orange{fill:#e88200}
  </style>
  <rect x="1" y="1" width="1198" height="758" rx="8" fill="#fff" stroke="#c9ced3"/>
  <rect x="1" y="1" width="1198" height="53" rx="8" fill="#f4f5f6"/><rect x="1" y="45" width="1198" height="9" fill="#f4f5f6"/><line x1="1" y1="54" x2="1199" y2="54" stroke="#c9ced3"/>
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/><circle cx="50" cy="27" r="6" fill="#febc2e"/><circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text x="94" y="32" class="small muted">single-deployment-cashflow.csv</text>

  <text x="38" y="88" class="small"><tspan fill="#0f9d75">$</tspan> chart cashflow.csv --revenue-up --delivery-cost-down</text>
  <text x="38" y="132" class="head">one deployment: lose money once, keep the installed asset</text>
  <text x="38" y="159" class="small muted">illustrative economics from the notion model — not disclosed contract terms.</text>

  <g transform="translate(58 190)">
    <rect x="0" y="0" width="18" height="18" class="revenue"/><text x="28" y="14" class="tiny">customer pays $10m / year</text>
    <rect x="260" y="0" width="18" height="18" class="cost"/><text x="288" y="14" class="tiny">palantir delivery cost</text>
  </g>

  <rect x="58" y="232" width="1084" height="405" fill="#fff" stroke="#dadce0"/>
  <line x1="58" y1="330" x2="1142" y2="330" class="grid"/><line x1="58" y1="430" x2="1142" y2="430" class="axis"/><line x1="58" y1="530" x2="1142" y2="530" class="grid"/><line x1="58" y1="630" x2="1142" y2="630" class="grid"/>
  <text x="72" y="254" class="tiny muted">annual cash flow ($m)</text><text x="72" y="423" class="tiny muted">0</text>

  <g transform="translate(138 0)">
    <text x="70" y="274" text-anchor="middle" class="label red">net −$10m</text>
    <rect x="18" y="330" width="104" height="100" class="revenue"/><text x="70" y="386" text-anchor="middle" class="label green">$10m</text>
    <rect x="18" y="430" width="104" height="200" class="cost"/><text x="70" y="538" text-anchor="middle" class="label red">$20m</text>
    <text x="70" y="665" text-anchor="middle" class="small">year 1</text>
  </g>
  <g transform="translate(348 0)">
    <text x="70" y="274" text-anchor="middle" class="label green">net +$8m</text>
    <rect x="18" y="330" width="104" height="100" class="revenue"/><text x="70" y="386" text-anchor="middle" class="label green">$10m</text>
    <rect x="18" y="430" width="104" height="20" class="cost"/><text x="70" y="474" text-anchor="middle" class="tiny red">$2m</text>
    <text x="70" y="665" text-anchor="middle" class="small">year 2</text>
  </g>
  <g transform="translate(558 0)">
    <text x="70" y="274" text-anchor="middle" class="label green">net +$9m</text>
    <rect x="18" y="330" width="104" height="100" class="revenue"/><text x="70" y="386" text-anchor="middle" class="label green">$10m</text>
    <rect x="18" y="430" width="104" height="10" class="cost"/><text x="70" y="464" text-anchor="middle" class="tiny red">$1m</text>
    <text x="70" y="665" text-anchor="middle" class="small">year 3</text>
  </g>
  <g transform="translate(768 0)">
    <text x="70" y="274" text-anchor="middle" class="label green">net +$9m</text>
    <rect x="18" y="330" width="104" height="100" class="revenue"/><text x="70" y="386" text-anchor="middle" class="label green">$10m</text>
    <rect x="18" y="430" width="104" height="10" class="cost"/><text x="70" y="464" text-anchor="middle" class="tiny red">$1m</text>
    <text x="70" y="665" text-anchor="middle" class="small">year 4</text>
  </g>
  <g transform="translate(978 0)">
    <text x="70" y="274" text-anchor="middle" class="label green">net +$9m</text>
    <rect x="18" y="330" width="104" height="100" class="revenue"/><text x="70" y="386" text-anchor="middle" class="label green">$10m</text>
    <rect x="18" y="430" width="104" height="10" class="cost"/><text x="70" y="464" text-anchor="middle" class="tiny red">$1m</text>
    <text x="70" y="665" text-anchor="middle" class="small">year 5</text>
  </g>

  <text x="600" y="708" text-anchor="middle" class="small orange">the year-one loss buys software that keeps renewing after expensive delivery work collapses.</text>
  <text x="38" y="740" class="tiny muted">illustrative · one deployment · five years · $26m cumulative modeled net cash flow</text>
</svg>
