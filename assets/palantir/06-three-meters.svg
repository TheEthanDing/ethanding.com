<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title06 desc06">
  <title id="title06">three companies, three meters</title>
  <desc id="desc06">snowflake and databricks optimize usage, consultancies optimize labor, and palantir can optimize renewal and outcome-linked expansion.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#202124}.muted{fill:#5f6368}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:15px;font-weight:700}.head{font-size:26px;font-weight:700}.panel{fill:#fff;stroke:#dadce0}.track{fill:#f6f7f8;stroke:#dadce0}.blue{fill:#2f80ed}.green{fill:#0f9d75}.orange{fill:#e88200}.red{fill:#d64545}.purple{fill:#7b56d8}
  </style>
  <rect x="1" y="1" width="1198" height="758" rx="8" fill="#fff" stroke="#c9ced3"/>
  <rect x="1" y="1" width="1198" height="53" rx="8" fill="#f4f5f6"/><rect x="1" y="45" width="1198" height="9" fill="#f4f5f6"/><line x1="1" y1="54" x2="1199" y2="54" stroke="#c9ced3"/>
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/><circle cx="50" cy="27" r="6" fill="#febc2e"/><circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text x="94" y="32" class="small muted">customer-success-meters.log</text>

  <text x="38" y="88" class="small"><tspan fill="#0f9d75">$</tspan> inspect incentives --business-model all</text>
  <text x="38" y="132" class="head">everyone says “customer success.” the meter says what they mean.</text>
  <text x="38" y="159" class="small muted">three business models reward three different kinds of motion.</text>

  <g transform="translate(38 200)">
    <rect x="0" y="0" width="350" height="438" class="panel"/><rect x="0" y="0" width="350" height="5" class="blue"/>
    <text x="22" y="39" class="label">snowflake / databricks</text><text x="22" y="65" class="tiny blue">meter = usage</text>
    <text x="22" y="112" class="tiny muted">bytes / compute</text>
    <rect x="22" y="128" width="306" height="24" class="track"/><rect x="22" y="128" width="252" height="24" class="blue"/>
    <text x="22" y="191" class="small">more consumption</text><text x="22" y="216" class="small blue">→ more revenue</text>
    <line x1="22" y1="246" x2="328" y2="246" stroke="#dadce0"/>
    <text x="22" y="283" class="tiny muted">constraint:</text>
    <text x="22" y="313" class="small">hard to justify valuable work</text><text x="22" y="337" class="small">that barely moves consumption.</text>
    <text x="22" y="398" class="tiny muted">status: optimize the query meter</text>
  </g>

  <g transform="translate(425 200)">
    <rect x="0" y="0" width="350" height="438" class="panel"/><rect x="0" y="0" width="350" height="5" class="red"/>
    <text x="22" y="39" class="label">si / consultancy</text><text x="22" y="65" class="tiny red">meter = labor</text>
    <text x="22" y="112" class="tiny muted">hours / scope</text>
    <rect x="22" y="128" width="306" height="24" class="track"/><rect x="22" y="128" width="272" height="24" class="red"/>
    <text x="22" y="191" class="small">more billed labor</text><text x="22" y="216" class="small red">→ more revenue</text>
    <line x1="22" y1="246" x2="328" y2="246" stroke="#dadce0"/>
    <text x="22" y="283" class="tiny muted">constraint:</text>
    <text x="22" y="313" class="small">each project has to carry</text><text x="22" y="337" class="small">its own delivery margin.</text>
    <text x="22" y="398" class="tiny muted">status: the fx desk says fee</text>
  </g>

  <g transform="translate(812 200)">
    <rect x="0" y="0" width="350" height="438" fill="#fff8ed" stroke="#e88200" stroke-width="2"/><rect x="0" y="0" width="350" height="5" class="orange"/>
    <text x="22" y="39" class="label">palantir</text><text x="22" y="65" class="tiny orange">meter = account / outcome</text>
    <text x="22" y="112" class="tiny muted">renew + expand</text>
    <rect x="22" y="128" width="306" height="24" class="track"/><rect x="22" y="128" width="285" height="24" class="orange"/>
    <text x="22" y="191" class="small">move a p&amp;l number</text><text x="22" y="216" class="small orange">→ earn the next project</text>
    <line x1="22" y1="246" x2="328" y2="246" stroke="#efc992"/>
    <text x="22" y="283" class="tiny muted">option:</text>
    <text x="22" y="313" class="small">overinvest now if the software</text><text x="22" y="337" class="small">becomes durable.</text>
    <text x="22" y="398" class="tiny muted">status: the fix is the renewal</text>
  </g>

  <rect x="176" y="668" width="848" height="48" fill="#f6f7f8" stroke="#dadce0"/>
  <text x="600" y="698" text-anchor="middle" class="small">not pure outcome pricing — a different account-level incentive.</text>
  <text x="38" y="740" class="tiny muted">three meters · one phrase · materially different optimization functions</text>
</svg>
