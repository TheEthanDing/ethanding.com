<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title05 desc05">
  <title id="title05">the product accumulated; it was not designed all at once</title>
  <desc id="desc05">a timeline traces palantir from its 2003 foundation through gotham, government deployments, commercial scaling, foundry, and aip.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#202124}.muted{fill:#5f6368}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:15px;font-weight:700}.head{font-size:26px;font-weight:700}.event{font-size:15px;font-weight:700}.line{stroke:#c9ced3;stroke-width:1.5}.blue{fill:#2f80ed}.green{fill:#0f9d75}.orange{fill:#e88200}.red{fill:#d64545}.purple{fill:#7b56d8}
  </style>
  <rect x="1" y="1" width="1198" height="918" rx="8" fill="#fff" stroke="#c9ced3"/>
  <rect x="1" y="1" width="1198" height="53" rx="8" fill="#f4f5f6"/><rect x="1" y="45" width="1198" height="9" fill="#f4f5f6"/><line x1="1" y1="54" x2="1199" y2="54" stroke="#c9ced3"/>
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/><circle cx="50" cy="27" r="6" fill="#febc2e"/><circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text x="94" y="32" class="small muted">palantir-product-history.log</text>

  <text x="38" y="88" class="small"><tspan fill="#0f9d75">$</tspan> cat product-history.log --show-forced-layers</text>
  <text x="38" y="132" class="head">the product accumulated; it was not designed all at once</text>
  <text x="38" y="159" class="small muted">each era forced palantir to keep another layer of the stack.</text>

  <line x1="80" y1="204" x2="80" y2="802" class="line"/>

  <g transform="translate(0 206)">
    <circle cx="80" cy="16" r="6" class="red"/><text x="110" y="20" class="tiny muted">2003</text>
    <text x="235" y="20" class="event">foundation</text>
    <text x="235" y="45" class="small">counterterrorism · objects + relationships · built to support action</text>
  </g>

  <g transform="translate(0 298)">
    <circle cx="80" cy="16" r="6" class="blue"/><text x="110" y="20" class="tiny muted">2008</text>
    <text x="235" y="20" class="event">gotham</text>
    <text x="235" y="45" class="small">integrate messy sources · investigate the graph · hand decisions to operators</text>
  </g>

  <g transform="translate(0 390)">
    <circle cx="80" cy="16" r="6" class="orange"/><text x="110" y="20" class="tiny muted">government era</text>
    <text x="235" y="20" class="event">no modern stack to assume</text>
    <text x="235" y="45" class="small">on-prem + classified · connectors + permissions · deployment + upgrades</text>
  </g>

  <g transform="translate(0 482)">
    <circle cx="80" cy="16" r="6" class="purple"/><text x="110" y="20" class="tiny muted">commercial</text>
    <text x="235" y="20" class="event">the graph was not enough</text>
    <text x="235" y="45" class="small">petabyte analytics · streaming + applications · same object-first model</text>
  </g>

  <g transform="translate(0 574)">
    <circle cx="80" cy="16" r="6" class="green"/><text x="110" y="20" class="tiny muted">2016</text>
    <text x="235" y="20" class="event">foundry</text>
    <text x="235" y="45" class="small">integration + analytics · ontology + applications · action + writeback</text>
  </g>

  <g transform="translate(0 666)">
    <circle cx="80" cy="16" r="6" class="green"/><text x="110" y="20" class="tiny muted">now</text>
    <text x="235" y="20" class="event">aip</text>
    <text x="235" y="45" class="small">models + agents enter the same governed loop: data → logic → action</text>
  </g>

  <rect x="38" y="774" width="1124" height="82" fill="#fff8ed" stroke="#e88200"/>
  <text x="58" y="806" class="label orange">not literally the same product.</text>
  <text x="58" y="834" class="small">spiritually: messy data → governed objects → action, with an increasingly zeitgeisty name.</text>
  <line x1="38" y1="878" x2="1162" y2="878" stroke="#dadce0"/>
  <text x="38" y="902" class="tiny muted">eof · six eras · one increasingly branded operating loop</text>
</svg>
