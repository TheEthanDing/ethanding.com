<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title02 desc02">
  <title id="title02">the machine that made palantir</title>
  <desc id="desc02">three unusual inputs pass through twelve years of full-stack deployments and compound into differentiated talent, product, and business model.</desc>
  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#202124}.muted{fill:#5f6368}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:15px;font-weight:700}.head{font-size:27px;font-weight:700}.panel{fill:#fff;stroke:#dadce0}.input{fill:#f6f7f8;stroke:#dadce0}.core{fill:#fff8ed;stroke:#e88200;stroke-width:2}.wire{fill:none;stroke:#5f6368;stroke-width:1.5}.blue{fill:#2f80ed}.green{fill:#0f9d75}.orange{fill:#e88200}.red{fill:#d64545}.purple{fill:#7b56d8}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="788" rx="8" fill="#fff" stroke="#c9ced3"/>
  <rect x="1" y="1" width="1198" height="53" rx="8" fill="#f4f5f6"/><rect x="1" y="45" width="1198" height="9" fill="#f4f5f6"/><line x1="1" y1="54" x2="1199" y2="54" stroke="#c9ced3"/>
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/><circle cx="50" cy="27" r="6" fill="#febc2e"/><circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text x="94" y="32" class="small muted">palantir-causal-graph.log</text>

  <text x="38" y="82" class="small"><tspan fill="#0f9d75">$</tspan> trace --from constraints --through deployments --to advantages</text>
  <text x="38" y="126" class="head">the machine that made palantir</text>
  <text x="38" y="153" class="small muted">three conditions held together long enough for deployment work to compound.</text>

  <text x="48" y="203" class="label blue">inputs/</text><text x="448" y="203" class="label orange">compounding_loop/</text><text x="805" y="203" class="label green">outputs/</text>

  <g transform="translate(38 226)">
    <rect x="0" y="0" width="332" height="112" class="input"/>
    <text x="18" y="28" class="tiny blue">[01] hard customer</text>
    <text x="18" y="55" class="label">government customers with</text><text x="18" y="77" class="label">no usable modern stack</text>
    <text x="18" y="99" class="tiny muted">forced full-chain ownership</text>

    <rect x="0" y="138" width="332" height="112" class="input"/>
    <text x="18" y="166" class="tiny purple">[02] long runway</text>
    <text x="18" y="193" class="label">patient capital + paying</text><text x="18" y="215" class="label">government deployments</text>
    <text x="18" y="237" class="tiny muted">enough time not to die</text>

    <rect x="0" y="276" width="332" height="112" class="input"/>
    <text x="18" y="304" class="tiny red">[03] non-consensus years</text>
    <text x="18" y="331" class="label">twelve-ish years wandering</text><text x="18" y="353" class="label">through the pmf desert</text>
    <text x="18" y="375" class="tiny muted">stayed ugly, weird, and selective</text>
  </g>

  <path d="M370 282C417 282 429 353 463 365" class="wire" marker-end="url(#arrow02)"/>
  <path d="M370 420H463" class="wire" marker-end="url(#arrow02)"/>
  <path d="M370 558C417 558 429 487 463 475" class="wire" marker-end="url(#arrow02)"/>

  <g transform="translate(467 265)">
    <rect x="0" y="0" width="285" height="315" class="core"/>
    <text x="18" y="33" class="tiny orange">while year &lt; ~12:</text>
    <text x="18" y="74" class="label">own the whole problem</text>
    <text x="18" y="112" class="label">solve it inside operations</text>
    <text x="18" y="150" class="label">return repeated parts</text><text x="18" y="172" class="label">to the product</text>
    <path d="M34 208H248V270H34V208" fill="none" stroke="#e88200" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="52" y="238" class="small orange">deploy → learn → productize</text>
    <text x="52" y="262" class="small orange">→ harder deployment</text>
    <text x="18" y="298" class="tiny muted"># the part people skip</text>
  </g>

  <path d="M752 332C786 322 788 282 816 282" class="wire" marker-end="url(#arrow02)"/>
  <path d="M752 420H816" class="wire" marker-end="url(#arrow02)"/>
  <path d="M752 508C786 518 788 558 816 558" class="wire" marker-end="url(#arrow02)"/>

  <g transform="translate(820 226)">
    <rect x="0" y="0" width="342" height="112" class="panel"/><rect x="0" y="0" width="6" height="112" class="blue"/>
    <text x="22" y="27" class="tiny blue">talent</text><text x="22" y="52" class="label">swe-quality engineers</text><text x="22" y="73" class="label">doing implementation</text>
    <text x="22" y="96" class="tiny muted">orthogonal filter · leadership grown inside</text>

    <rect x="0" y="138" width="342" height="112" class="panel"/><rect x="0" y="138" width="6" height="112" class="green"/>
    <text x="22" y="165" class="tiny green">product</text><text x="22" y="190" class="label">analytical scale ↔ ontology</text><text x="22" y="211" class="label">↔ operational action</text>
    <text x="22" y="234" class="tiny muted">on-prem · air-gapped · edge deployable</text>

    <rect x="0" y="276" width="342" height="112" class="panel"/><rect x="0" y="276" width="6" height="112" class="orange"/>
    <text x="22" y="303" class="tiny orange">business model + culture</text><text x="22" y="328" class="label">invest up front · afford</text><text x="22" y="349" class="label">expensive people</text>
    <text x="22" y="372" class="tiny muted">underwrite the account, not hours or queries</text>
  </g>

  <path d="M991 632C872 684 320 684 196 639" fill="none" stroke="#0f9d75" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow02)"/>
  <rect x="348" y="666" width="504" height="30" fill="#fff"/>
  <text x="600" y="687" text-anchor="middle" class="small green">stronger platform → harder customer → run the loop again</text>
  <line x1="38" y1="731" x2="1162" y2="731" stroke="#dadce0"/>
  <text x="38" y="758" class="tiny muted">hard environment without capital = bankrupt integrator · capital without hard environment = bloated platform</text>
</svg>
