<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">palantir shared one engineering funnel while conventional software companies used two</title>
  <desc id="desc">one shared palantir engineering bar branches into core software engineering and forward-deployed software engineering, while a conventional cloud company hires software and solutions engineers through separate tracks.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".06"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#377dff" stroke-width="1.7"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#149f67" stroke-width="1.7"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#db8400" stroke-width="1.7"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #252a31; }
      .title { font-size: 31px; font-weight: 800; letter-spacing: -.7px; }
      .subtitle { font-size: 16px; fill: #68717c; }
      .prompt { font-size: 16px; fill: #252a31; }
      .section { font-size: 19px; font-weight: 800; }
      .head { font-size: 17px; font-weight: 800; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #68717c; }
      .micro { font-size: 12px; fill: #68717c; }
      .blue { fill: #377dff; } .green { fill: #149f67; } .orange { fill: #db8400; } .red { fill: #dd5050; } .purple { fill: #8058cf; }
      .panel { fill: #ffffff; stroke: #c9cdd2; stroke-width: 1.2; }
      .soft { fill: #f7f8fa; stroke: #dfe3e7; stroke-width: 1; }
      .rule { stroke: #dfe3e7; stroke-width: 1; }
      .dash { stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f7f7f5"/>
  <rect x="1" y="1" width="1198" height="818" rx="8" fill="#ffffff" stroke="#c9cdd2" filter="url(#shadow)"/>
  <path d="M9 1 H1191 Q1199 1 1199 9 V55 H1 V9 Q1 1 9 1 Z" fill="#f1f2f4"/>
  <line x1="1" y1="55" x2="1199" y2="55" stroke="#c9cdd2"/>
  <circle cx="28" cy="28" r="7" fill="#ff5f57"/><circle cx="50" cy="28" r="7" fill="#febc2e"/><circle cx="72" cy="28" r="7" fill="#28c840"/>
  <text x="94" y="34" class="small">engineering-funnel.diff</text>
  <text x="42" y="98" class="prompt"><tspan class="green">$</tspan> diff --talent-architecture palantir conventional-cloud</text>
  <text x="42" y="147" class="title">same company. completely different talent architecture.</text>
  <text x="42" y="177" class="subtitle">palantir cleared the engineering bar first. most software companies choose the job family first.</text>
  <line x1="600" y1="211" x2="600" y2="712" class="rule dash"/>
  <text x="42" y="231" class="section green">+ palantir / one engineering funnel</text>
  <text x="628" y="231" class="section orange">- conventional cloud / two funnels</text>
  <text x="42" y="257" class="micro">interview-derived model · not an official org chart</text>
  <text x="628" y="257" class="micro">separate postings · interview loops · ladders</text>
  <rect x="146" y="297" width="350" height="69" class="panel"/><text x="321" y="326" text-anchor="middle" class="head">engineering candidate</text><text x="321" y="350" text-anchor="middle" class="small">same technical talent market</text>
  <path d="M321 368 V397" fill="none" stroke="#149f67" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="120" y="405" width="402" height="82" fill="#f4fbf8" stroke="#149f67" stroke-width="1.5"/><text x="321" y="438" text-anchor="middle" class="head">coding + systems bar</text><text x="321" y="466" text-anchor="middle" class="body">production engineering before deployment</text>
  <path d="M321 489 V524 M321 524 L208 558 M321 524 L434 558" fill="none" stroke="#149f67" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="92" y="565" width="232" height="87" fill="#f4fbf8" stroke="#149f67"/><text x="208" y="600" text-anchor="middle" class="head">core swe</text><text x="208" y="628" text-anchor="middle" class="small">build the platform</text>
  <rect x="336" y="565" width="232" height="87" fill="#f4fbf8" stroke="#149f67"/><text x="452" y="600" text-anchor="middle" class="head">fdse</text><text x="452" y="628" text-anchor="middle" class="small">build in the field</text>
  <text x="628" y="303" class="small blue">software engineering track</text>
  <rect x="628" y="319" width="208" height="80" class="panel"/><text x="732" y="351" text-anchor="middle" class="head">swe posting</text><text x="732" y="379" text-anchor="middle" class="small">coding + systems</text>
  <path d="M838 359 H879" fill="none" stroke="#db8400" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="888" y="319" width="260" height="80" fill="#fff8ed" stroke="#db8400"/><text x="1018" y="351" text-anchor="middle" class="head">software engineer</text><text x="1018" y="379" text-anchor="middle" class="small">~$250k · illustrative</text>
  <line x1="628" y1="440" x2="1148" y2="440" class="rule dash"/>
  <text x="628" y="483" class="small purple">solutions / sales engineering track</text>
  <rect x="628" y="499" width="208" height="98" class="panel"/><text x="732" y="532" text-anchor="middle" class="head">se posting</text><text x="732" y="560" text-anchor="middle" class="small">customer + demo</text><text x="732" y="582" text-anchor="middle" class="micro">architecture loop</text>
  <path d="M838 548 H879" fill="none" stroke="#db8400" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="888" y="499" width="260" height="98" fill="#fff8ed" stroke="#db8400"/><text x="1018" y="532" text-anchor="middle" class="head">solutions engineer</text><text x="1018" y="560" text-anchor="middle" class="small">~$180k · illustrative</text><text x="1018" y="582" text-anchor="middle" class="micro">different ladder</text>
  <text x="888" y="646" text-anchor="middle" class="head orange">the split happens before the interview</text>
  <rect x="42" y="700" width="1116" height="63" fill="#f4fbf8" stroke="#149f67"/>
  <text x="600" y="729" text-anchor="middle" class="section green">palantir selected engineers first—then decided where to deploy them.</text>
  <text x="600" y="751" text-anchor="middle" class="micro">compensation figures are stylized examples, not current aws or palantir compensation data.</text>
  <text x="42" y="795" class="small"><tspan class="green">eof</tspan> · one shared bar vs. two independent labor markets</text>
</svg>
